services:
  postgres:
    image: postgres:16-alpine
    container_name: app-store-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by postgres/init/01-create-metabase-db.sh on first boot only.
      MB_DB_NAME: ${MB_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: app-store-metabase
    ports:
      - "3000:3000"
    environment:
      # Metabase's own application metadata (dashboards, users, saved
      # questions) lives in its own database on the SAME Postgres instance
      # as the analytics data — separate database, separate concern, one
      # service to run. It is never the analytics database (POSTGRES_DB).
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_DB_NAME}
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      # Encrypts DB credentials Metabase stores internally (e.g. the
      # analytics connection added after setup). Required for a real
      # (cloud) deployment; generate your own with `openssl rand -base64 32`.
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
